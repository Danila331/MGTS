services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mgts
      POSTGRES_PASSWORD: mgts
      POSTGRES_DB: mgts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mgts -d mgts"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["migrate"]
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://mgts:mgts@postgres:5432/mgts?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      STORAGE: postgres
      PORT: 8080
      DATABASE_URL: postgres://mgts:mgts@postgres:5432/mgts?sslmode=disable
      LOG_LEVEL: info
      AI_PROVIDER: local
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["worker"]
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://mgts:mgts@postgres:5432/mgts?sslmode=disable
      LOG_LEVEL: info
      AI_PROVIDER: local
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
